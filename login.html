<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Exile</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <div class="center-screen">
        <div class="auth-wrap">
            <div class="card auth-card">

                <div class="brand-logo" style="background: none;">
                    <img src="assets/Exile_Logo.jpeg" alt="Logo Exile" style="width: 100%; height: 100%; object-fit: contain;">
                </div>

                <div class="auth-title">Express Digital Leave</div>
                <div class="auth-subtitle">Ajukan surat izin keluar sekolah secara digital<br>Cepat · Mudah · Tanpa Kertas</div>

                <div id="formMsg" class="form-msg error"></div>

                <form id="loginForm">
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="nama@email.com" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Masuk</button>
                </form>

                <div class="divider">atau</div>

                <button id="googleLoginBtn" class="btn btn-google">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
                    Masuk dengan Google
                </button>

                <div class="auth-switch">
                    Belum punya akun? <a href="register.html">Daftar Akun</a>
                </div>
            </div>

            <div class="footnote">
                SMKN 1 Cilegon · Privacy Policy and Terms of Use<br>
            </div>
        </div>
    </div>

    <script type="module" src="assets/app.js"></script>
    <script type="module">
    const existing = await EXILE.getCurrentUser();
    if (existing) window.location.href = EXILE.isPiket(existing) ? "dashboard.html" : "home.html";

        const params = new URLSearchParams(window.location.search);
        const msg = document.getElementById("formMsg");

        function showMsg(text, type = "error") {
            msg.textContent = text;
            msg.className = "form-msg show " + type;
        }

        if (params.get("registered")) {
            showMsg("Akun berhasil dibuat. Silakan masuk.", "success");
        }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        try {
            const user = await EXILE.loginWithPassword(email, password);
            EXILE.toast("Berhasil masuk!");
            setTimeout(() => {
                window.location.href = EXILE.isPiket(user) ? "dashboard.html" : "home.html";
            }, 400);
        } catch (err) {
            showMsg(err.message);
        }
        });

        document.getElementById("googleLoginBtn").addEventListener("click", async () => {
            try {
                const res = await EXILE.loginWithGoogle();
                if (!res) return; // popup ditutup
                if (res.needsProfile) {
                    window.location.href = "register.html?google=1";
                } else {
                    window.location.href = EXILE.isPiket(res.user) ? "dashboard.html" : "home.html";
                }
            } catch (err) {
                showMsg(err.message);
            }
        });
    </script>



</body>
</html>
