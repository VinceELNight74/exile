<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Exile</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <div class="center-screen">
        <div class="auth-wrap">
            <div class="card auth-card">

                <div class="brand-logo">
                    <div class="ex"><span>E</span><span>X</span></div>
                    <div class="tag">Exile</div>
                </div>

                <div class="auth-title">Buat Akun Baru</div>
                <div class="auth-subtitle">Daftar untuk mulai mengajukan izin keluar sekolah secara digital</div>

                <div id="formMsg" class="form-msg error"></div>

                <form id="registerForm">
                    <div class="field">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" placeholder="Contoh: Diaz Mauladani" required>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="nama@email.com" required>
                    </div>

                    <div class="row-2">
                        <div class="field">
                            <label for="tingkat">Tingkat</label>
                            <select id="tingkat" required>
                                <option value="" disabled selected>Pilih Tingkat</option>
                                <option value="X">X</option>
                                <option value="XI">XI</option>
                                <option value="XII">XII</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="jurusan">Jurusan</label>
                            <select id="jurusan" required>
                                <option value="" disabled selected>Pilih Jurusan</option>
                                <option value="RPL 1">RPL 1</option>
                                <option value="RPL 2">RPL 2</option>
                                <option value="RPL 3">RPL 3</option>
                                <option value="RPL 4">RPL 4</option>
                                <option value="OI 1">OI 1</option>
                                <option value="OI 2">OI 2</option>
                                <option value="MEKA 1">MEKA 1</option>
                                <option value="MEKA 2">MEKA 2</option>
                                <option value="ELIN 1">ELIN 1</option>
                                <option value="ELIN 2">ELIN 2</option>
                                <option value="DGM 1">DGM 1</option>
                                <option value="DGM 1">DGM 2</option>
                                <option value="LAS 1">LAS 1</option>
                                <option value="LAS 2">LAS 2</option>
                                <option value="M 1">M 1</option>
                                <option value="M 1">M 2</option>
                                <option value="TKR 1">TKR 1</option>
                                <option value="TKR 2">TKR 2</option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <label for="noAbsen">Absen</label>
                        <input type="number" id="noAbsen" placeholder="8" min="1" max="99" step="1">
                    </div>

                    <div id="passwordFields">
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Minimal 6 karakter" required minlength="6">
                    </div>

                    <div class="field">
                        <label for="confirmPassword">Konfirmasi Password</label>
                        <input type="password" id="confirmPassword" placeholder="Ulangi password" required minlength="6">
                    </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Daftar Akun</button>
                </form>

                <div id="googleSection">
                <div class="divider">atau</div>

                <button id="googleRegisterBtn" class="btn btn-google">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.88 2.69-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.96 10.71A5.4 5.4 0 0 1 3.68 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/></svg>
                    Daftar dengan Google
                </button>
                </div>

                <div class="auth-switch">
                    Sudah punya akun? <a href="login.html">Masuk di sini</a>
                </div>
            </div>

            <div class="footnote">
                Dengan mendaftar, kamu menyetujui Kebijakan Privasi &amp; Ketentuan Layanan Exile - SMKN 1 Cilegon
            </div>
        </div>
    </div>

    <script type="module" src="assets/app.js"></script>
    <script type="module">
        // Jika sudah login, langsung ke home
        if (await EXILE.getCurrentUser()) window.location.href = "home.html";

        const form = document.getElementById("registerForm");
        const msg = document.getElementById("formMsg");

        function showMsg(text, type = "error") {
            msg.textContent = text;
            msg.className = "form-msg show " + type;
        }

        // Mode Google: akun Google sudah login, tinggal melengkapi kelas & no. absen
        const googleMode = new URLSearchParams(window.location.search).get("google") === "1";
        if (googleMode) {
            const fb = await EXILE.getFirebaseUser();
            if (!fb) {
                window.location.href = "login.html";
            } else {
                document.getElementById("nama").value = fb.displayName || "";
                const emailEl = document.getElementById("email");
                emailEl.value = fb.email;
                emailEl.readOnly = true;
                emailEl.style.background = "#eee";
                document.getElementById("passwordFields").style.display = "none";
                document.getElementById("password").required = false;
                document.getElementById("confirmPassword").required = false;
                document.getElementById("googleSection").style.display = "none";
                showMsg("Akun Google terhubung. Lengkapi kelas dan no. absen untuk melanjutkan.", "success");
            }
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const nama = document.getElementById("nama").value.trim();
            const email = document.getElementById("email").value.trim();
            const tingkat = document.getElementById("tingkat").value.trim();
            const jurusan = document.getElementById("jurusan").value.trim();
            const kelas = ( tingkat && jurusan ) ? `${tingkat} ${jurusan}` : "";

            if (!kelas){
                showMsg("Pilih Tingkat atau Jurusan terlebih dahulu");
                return;
            }
            const noAbsen = String(parseInt(document.getElementById("noAbsen").value, 10) || "");

            if (googleMode) {
                try {
                    await EXILE.completeGoogleProfile({ nama, kelas, noAbsen });
                    EXILE.toast("Akun berhasil dibuat!");
                    setTimeout(() => window.location.href = "home.html", 600);
                } catch (err) {
                    showMsg(err.message);
                }
                return;
            }

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                showMsg("Password dan konfirmasi password tidak sama.");
                return;
            }

            try {
                await EXILE.registerUser({ nama, email, password, kelas, noAbsen });
                EXILE.toast("Akun berhasil dibuat! Cek email untuk verifikasi.");
                setTimeout(() => window.location.href = "verify.html", 800);
            } catch (err) {
                showMsg(err.message);
            }
        });

        document.getElementById("googleRegisterBtn").addEventListener("click", async () => {
            try {
                const res = await EXILE.loginWithGoogle();
                if (!res) return; // popup ditutup
                if (res.needsProfile) {
                    window.location.href = "register.html?google=1";
                } else {
                    window.location.href = EXILE.isPiket(res.user) ? "dashboard.html" : "home.html";
                }
            } catch (err) {
                showMsg(err.message);
            }
        });
    </script>

</body>
</html>
