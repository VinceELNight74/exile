<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Surat Izin - Exile</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="assets/Exile_Logo.jpeg" alt="Logo Exile" style="height: 28px;">
            <div class="brand-word">EX<span style="color:var(--emas)">ILE</span></div>
        </div>
        <div class="nav-right">
            <div class="nav-user">Halo, <b id="navNama">-</b></div>
            <button class="btn-logout" id="logoutBtn">Keluar</button>
        </div>
    </nav>

    <div class="center-screen" style="min-height:auto;padding-top:36px;">
        <div class="auth-wrap" style="max-width:480px;">
            <div class="card auth-card" style="text-align:left;">

                <div style="text-align:center;">
                    <div class="auth-title">Formulir Izin Keluar</div>
                    <div class="auth-subtitle">Isi data berikut dengan lengkap dan benar</div>
                </div>

                <div id="formMsg" class="form-msg error"></div>

                <form id="izinForm">
                    <div class="field">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" required>
                    </div>

                    <div class="row-2">
                        <div class="field">
                            <label for="kelas">Kelas</label>
                            <input type="text" id="kelas" placeholder="XII RPL 1" required>
                        </div>
                        <div class="field">
                            <label for="noAbsen">No. Absen</label>
                            <input type="number" id="noAbsen" placeholder="12" required min="1">
                        </div>
                    </div>

                    <div class="field">
                        <label for="alasan">Alasan Keluar Lingkungan Sekolah</label>
                        <textarea id="alasan" rows="4" placeholder="Contoh: Izin ke apotek membeli obat karena sakit perut mendadak" required></textarea>
                        <small class="hint">Jelaskan alasan dengan jujur dan jelas. Guru piket akan meninjau pengajuanmu.</small>
                    </div>

                    <button type="submit" class="btn btn-primary"><span data-icon="send"></span> Kirim Pengajuan</button>
                    <button type="button" class="btn btn-outline" style="margin-top:10px;" onclick="window.location.href='home.html'">Batal</button>
                </form>

            </div>
        </div>
    </div>

    <script type="module" src="assets/icons.js"></script>
    <script type="module" src="assets/app.js"></script>
    <script type="module">
        const user = await EXILE.requireAuth();
        if (user) {
            document.getElementById("navNama").textContent = user.nama;
            document.getElementById("nama").value = user.nama;
            document.getElementById("nama").readOnly = true;
            document.getElementById("nama").style.background = "#eee";
            if (user.kelas) document.getElementById("kelas").value = user.kelas;
            if (user.noAbsen) document.getElementById("noAbsen").value = user.noAbsen;
        }

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            if (confirm("Yakin ingin keluar akun?")) {
                await EXILE.logout();
                window.location.href = "login.html";
            }
        });

        const msg = document.getElementById("formMsg");
        function showMsg(text) {
            msg.textContent = text;
            msg.className = "form-msg show error";
        }

        document.getElementById("izinForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const nama = document.getElementById("nama").value.trim();
            const kelas = document.getElementById("kelas").value.trim();
            const noAbsen = document.getElementById("noAbsen").value.trim();
            const alasan = document.getElementById("alasan").value.trim();

            if (alasan.length < 4 || alasan.trim().toLowerCase() === 'sakit') {
                showMsg("Alasan terlalu singkat. Jelaskan lebih detail ya.");
                return;
            }

            try {
                // Simpan data terbaru ke profil supaya form berikutnya sudah terisi otomatis
                await EXILE.updateProfile(user.id, { kelas, noAbsen });

                const req = await EXILE.createRequest({ userId: user.id, nama, kelas, noAbsen, alasan });
                window.location.replace("waiting.html?id=" + req.id);
            } catch (err) {
                showMsg("Gagal mengirim pengajuan. Coba lagi.");
            }
        });
    </script>

</body>
</html>
