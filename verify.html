<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Email - Exile</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <div class="center-screen">
        <div class="auth-wrap">
            <div class="card auth-card">

                <div class="brand-logo" style="background: none;">
                    <img src="assets/Exile_Logo.jpeg" alt="Logo Exile" style="width: 100%; height: 100%; object-fit: contain;">
                </div>

                <div class="auth-title">Verifikasi Email</div>
                <div class="auth-subtitle">Kami mengirim link verifikasi ke <b id="vEmail">email-mu</b>.<br>Buka email tersebut (cek juga folder Spam), klik link-nya, lalu tekan tombol di bawah.</div>

                <div id="formMsg" class="form-msg error"></div>

                <button id="checkBtn" class="btn btn-primary">Saya Sudah Verifikasi</button>
                <button id="resendBtn" class="btn btn-google" style="margin-top:10px;">Kirim Ulang Email Verifikasi</button>

                <div class="auth-switch" style="margin-top:16px;">
                    <a href="#" id="logoutLink">Keluar / ganti akun</a>
                </div>
            </div>

            <div class="footnote">
                SMKN 1 Cilegon · Privacy Policy and Terms of Use<br>
            </div>
        </div>
    </div>

    <script type="module" src="assets/app.js"></script>
    <script type="module">
        const msg = document.getElementById("formMsg");
        function showMsg(text, type = "error") {
            msg.textContent = text;
            msg.className = "form-msg show " + type;
        }

        const fb = await EXILE.getFirebaseUser();
        if (!fb) {
            window.location.href = "login.html";
        } else if (!EXILE.needsVerification(fb)) {
            window.location.href = "home.html";   // sudah terverifikasi / tidak wajib
        } else {
            document.getElementById("vEmail").textContent = fb.email;
        }

        document.getElementById("checkBtn").addEventListener("click", async () => {
            try {
                if (await EXILE.checkVerified()) {
                    EXILE.toast("Email terverifikasi!");
                    setTimeout(() => window.location.href = "home.html", 500);
                } else {
                    showMsg("Email belum terverifikasi. Pastikan kamu sudah mengeklik link di email.");
                }
            } catch (err) {
                showMsg(err.message);
            }
        });

        document.getElementById("resendBtn").addEventListener("click", async () => {
            try {
                await EXILE.resendVerification();
                showMsg("Email verifikasi dikirim ulang. Cek inbox dan folder Spam.", "success");
            } catch (err) {
                showMsg(err.message);
            }
        });

        document.getElementById("logoutLink").addEventListener("click", async (e) => {
            e.preventDefault();
            await EXILE.logout();
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
